# ========================================================== #
#                                                            #
#                 ChatMT V2 - Configuration                  #
#                   Author: MT Studio                        #
#                                                            #
# ========================================================== #
# [RU] Поддерживается форматирование MiniMessage (градиенты, ховеры, клики)
# [EN] MiniMessage formatting is supported (gradients, hovers, clicks)

system:
  # [RU] Выберите язык плагина (файлы из папки plugins/ChatMT/language/)
  # [EN] Select plugin language (files from plugins/ChatMT/language/)
  # Доступно / Available: ru, en
  language: "ru"

features:
  # [RU] Включение кастомных сообщений о смерти
  # [EN] Enable custom death messages
  death-messages: true

ai:
  # [RU] Включение ИИ-ассистента в чате
  # [EN] Enable in-game AI assistant
  enabled: true

  # [RU] Триггер, на который реагирует бот (в начале сообщения)
  # [EN] Trigger phrase in chat
  trigger: "Бот,"

  # [RU] Выбор активного провайдера:
  #      - "gemini"            : Прямой API Google Gemini
  #      - "openai-compatible" : Универсальный режим (DeepSeek, Grok, OpenAI, OpenRouter)
  #      - "local"             : Локальные нейросети БЕЗ интернета (Ollama, LM Studio)
  #      - "claude"            : Прямой API Anthropic Claude
  # [EN] Provider selection: gemini, openai-compatible, local, claude
  provider: "gemini"

  # [RU] Системный промпт (характер бота, контекст сервера и правила общения)
  # [EN] System prompt defining persona and tone
  system-prompt: "Ты умный и дружелюбный ассистент на сервере Minecraft MT. Отвечай кратко, емко (максимум 2-3 предложения), без лишней воды и строго по делу."

  # [RU] Креативность ответов от 0.0 до 1.0 (чем ниже, тем точнее и строже)
  # [EN] Temperature from 0.0 to 1.0
  temperature: 0.7

  # [RU] Лимит токенов на ответ, чтобы не забивать чат длинным текстом
  # [EN] Max tokens limit
  max-tokens: 250

  # ==============================================================================
  # 1. НАСТРОЙКИ GOOGLE GEMINI (если provider: "gemini")
  # ==============================================================================
  gemini:
    # [RU] API-ключ от Google AI Studio
    # [EN] API key from Google AI Studio
    api-key: "ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ / INSERT_YOUR_KEY_HERE"

    # [RU] Модель Gemini (например: gemini-3.5-flash-lite, gemini-2.5-flash, gemini-1.5-pro)
    # [EN] Gemini model identifier
    model: "gemini-3.5-flash-lite"

  # ==============================================================================
  # 2. УНИВЕРСАЛЬНЫЙ РЕЖИМ И ЛОКАЛЬНЫЙ ИИ (если provider: "openai-compatible" / "local")
  # ==============================================================================
  # ПРИМЕРЫ ДЛЯ БЫСТРОГО ПЕРЕКЛЮЧЕНИЯ:
  #
  # • DEEPSEEK:
  #   endpoint: "https://api.deepseek.com/v1/chat/completions"
  #   model: "deepseek-chat"
  #
  # • OLLAMA (Локально на сервере БЕЗ ИНТЕРНЕТА):
  #   endpoint: "http://localhost:11434/v1/chat/completions"
  #   model: "llama3:8b" # или qwen2.5:7b, mistral
  #   api-key: "" # ключ не требуется
  #
  # • LM STUDIO (Локально с GUI):
  #   endpoint: "http://localhost:1234/v1/chat/completions"
  #   model: "local-model"
  #   api-key: ""
  #
  # • OPENAI / GROK:
  #   endpoint: "https://api.openai.com/v1/chat/completions"
  #   model: "gpt-4o-mini" # или grok-2-latest
  # ==============================================================================
  universal:
    # [RU] URL эндпоинта для OpenAI-совместимых запросов
    # [EN] Endpoint URL for OpenAI-compatible requests
    endpoint: "https://api.deepseek.com/v1/chat/completions"

    # [RU] API-ключ (для локальных Ollama / LM Studio оставь пустым "")
    # [EN] API key (leave blank "" for local Ollama / LM Studio)
    api-key: "ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ"

    # [RU] Имя модели
    # [EN] Model identifier
    model: "deepseek-chat"

  # ==============================================================================
  # 3. ANTHROPIC CLAUDE (если provider: "claude")
  # ==============================================================================
  claude:
    api-key: "ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ"
    model: "claude-3-5-sonnet-20241022"

chat:
  # [RU] Радиус локального чата (в блоках). Если -1, то радиус отключен
  # [EN] Local chat radius (in blocks). Set to -1 to disable
  local-radius: 100
  # [RU] Символ для отправки сообщения в глобальный чат
  # [EN] Prefix used to send messages to global chat
  global-prefix: "!"

  # [RU] Формат чата (Оставь пустым "", если используешь другой плагин на чат, например LuckPerms+ChatEx)
  # [EN] Chat format (Leave blank "" if using another chat plugin)
  format:
    global: "<dark_gray>[<gold>G<dark_gray>] <gray>%player% <dark_gray>» <white>%message%"
    local: "<dark_gray>[<yellow>L<dark_gray>] <gray>%player% <dark_gray>» <white>%message%"

  mentions:
    # [RU] Настройки упоминаний (@Ник)
    # [EN] Player mentions settings (@PlayerName)
    enabled: true
    color: "<yellow><bold>"
    # [RU] Время бездействия в секундах до статуса AFK (180 = 3 минуты)
    # [EN] Idle time in seconds before AFK status (180 = 3 minutes)
    afk-seconds: 180
    # [RU] Настройка звука при упоминании (Оставьте пусто "", чтобы отключить)
    # [EN] Mention sound settings (Leave blank "" to disable)
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2

  hover-moderation:
    # [RU] Кнопки быстрого наказания [М] [В] [К] перед сообщениями для администрации
    # [EN] Quick moderation buttons [M] [W] [K] before messages for staff
    enabled: true

channels:
  # [RU] Система тематических веток чата (#торговля, #помощь, #staff)
  # [EN] Topic chat channels system (#trade, #help, #staff)
  enabled: true
  list:
    trade:
      # [RU] Основной префикс и алиасы для отправки в канал
      # [EN] Main prefix and aliases to route message into the channel
      prefix: "#торговля"
      aliases:
        - "#trade"
        - "#т"
      format: "<dark_gray>[<gradient:#f6d365:#fda085>Торговля</gradient><dark_gray>] <gray>%player_name% <dark_gray>» <yellow><message>"
      # [RU] Необходимое право (оставь пустым "", если доступно всем)
      # [EN] Required permission (leave blank "" for everyone)
      permission: ""
      # [RU] Радиус видимости (-1 = весь сервер)
      # [EN] Visibility radius (-1 = global broadcast)
      radius: -1
    help:
      prefix: "#помощь"
      aliases:
        - "#help"
        - "#п"
      format: "<dark_gray>[<gradient:#4facfe:#00f2fe>Помощь</gradient><dark_gray>] <gray>%player_name% <dark_gray>» <white><message>"
      permission: ""
      radius: -1
    staff:
      prefix: "#staff"
      aliases:
        - "#s"
        - "#персонал"
      format: "<dark_gray>[<gradient:#ff0844:#ffb199>Staff</gradient><dark_gray>] <gray>%player_name% <dark_gray>» <red><message>"
      permission: "chatmt.channel.staff"
      radius: -1

filters:
  caps:
    enabled: true
    # [RU] Минимальная длина сообщения для проверки
    # [EN] Minimum message length to check
    min-length: 5
    # [RU] Максимально допустимый процент заглавных букв
    # [EN] Maximum allowed percentage of uppercase letters
    max-percent: 70
    # [RU] Действие: 'block' (запретить отправку), 'lower' (перевести в нижний регистр)
    # [EN] Action: 'block' (prevent sending), 'lower' (convert to lowercase)
    action: "lower"

  spam:
    enabled: true
    # [RU] Задержка между сообщениями (в секундах)
    # [EN] Delay between messages (in seconds)
    delay-seconds: 1.5

  advertising:
    enabled: true
    # [RU] Разрешенные ссылки
    # [EN] Allowed domains
    whitelist:
      - "vk.com"
      - "discord.gg"
      - "youtube.com"
      - "t.me"

  swear:
    enabled: true
    # [RU] Действие: 'block' (запретить), 'replace' (заменить на звездочки)
    # [EN] Action: 'block' (prevent sending), 'replace' (replace with stars)
    action: "replace"
    replace-char: "*"
    # [RU] Список запрещенных слов
    # [EN] List of blocked words
    words:
      - "дурак"
      - "idiot"

broadcast:
  enabled: true
  # [RU] Интервал между авто-сообщениями в секундах (300 = 5 минут)
  # [EN] Interval between auto-messages in seconds (300 = 5 minutes)
  interval: 300
  prefix: "<dark_gray>[<gradient:#00c6ff:#0072ff>Info</gradient><dark_gray>] <white>"
  messages:
    - "Не забывайте голосовать за наш сервер! / Don't forget to vote for our server!"
    # Пример использования MiniMessage для кликабельной ссылки
    - "Нашли баг? Пишите в Discord: <click:open_url:'https://discord.gg/your_guild'><aqua><underlined>discord.gg/your_guild</underlined></aqua></click>"
    - "В магазине скидки! Пиши <click:run_command:'/donate'><hover:show_text:'<green>Нажми, чтобы открыть донат-меню!'><green>/donate</green></hover></click>"

games:
  # [RU] Автоматические чат-игры (математика и анаграммы)
  # [EN] Automatic chat games (math and anagrams)
  enabled: true
  # [RU] Интервал запуска игр в секундах (240 = 4 минуты)
  # [EN] Game interval in seconds (240 = 4 minutes)
  interval: 240
  # [RU] Минимальный онлайн для старта игры
  # [EN] Minimum online players required to start a game
  min-players: 2
  # [RU] Время на ввод ответа в секундах
  # [EN] Time allowed to answer in seconds
  time-to-answer: 35
  # [RU] Консольные команды наград победителя (%player% заменится на ник)
  # [EN] Console reward commands (%player% will be replaced with name)
  rewards:
    - "eco give %player% 50"
    - "give %player% gold_ingot 3"
  # [RU] Список слов для режима «Анаграмма»
  # [EN] Word list for the "Anagram" mode
  words:
    - "алмаз"
    - "эндермен"
    - "крипер"
    - "незерит"
    - "верстак"
    - "обсидиан"
    - "редстоун"
    - "поршень"

punishments:
  # [RU] Лимит предупреждений до автоматического наказания
  # [EN] Warning limit before automatic punishment
  warn-limit: 3
  # [RU] Время системного мута при достижении лимита варнов (в секундах, 7200 = 2 часа)
  # [EN] System mute duration when warn limit is reached (in seconds)
  warn-mute-duration: 7200

network:
  # [RU] Включение связи между серверами через BungeeCord / Velocity
  # [EN] Enable cross-server sync via BungeeCord / Velocity
  enabled: true
  # [RU] Уникальное название текущего сервера (отображается в глобале)
  # [EN] Unique name of this server
  server-name: "survival-1"
  # [RU] Синхронизировать глобальный чат
  # [EN] Sync global chat across servers
  sync-global: true
  # [RU] Синхронизировать персонал-чат (#staff)
  # [EN] Sync staff chat (#staff) across servers
  sync-staff: true
  # [RU] Синхронизировать личные сообщения /msg
  # [EN] Sync private messages /msg across servers
  sync-pm: true

  # [RU] Форматы отображения сообщений с соседних серверов
  # [EN] Format for messages coming from remote servers
  format-global: "<dark_gray>[<gradient:#00c6ff:#0072ff>%server%</gradient><dark_gray>] [<gold>G<dark_gray>] <gray>%player% <dark_gray>» <white>%message%"
  format-staff: "<dark_gray>[<red>Staff<dark_gray>|<aqua>%server%<dark_gray>] <gray>%player% <dark_gray>» <red>%message%"

database:
  # [RU] Тип базы данных: sqlite или mysql
  # [EN] Database type: sqlite or mysql
  type: "sqlite"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "chatmt"
    username: "root"
    password: "password"