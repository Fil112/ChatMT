# +-----------------------------------------------------------------------+
# |                       ChatMT - Ultimate Solution                      |
# |        Developed for 1.16.5+ (Support HEX & Placeholders)             |
# +-----------------------------------------------------------------------+

# Основной язык плагина (файлы в папке lang/)
language: ru

# Глобальное управление модулями
# Установите 'false', чтобы полностью отключить функцию
modules:
  chat-format: true      # Форматирование чата (PAPI + HEX)
  auto-messages: true    # Автоматические объявления
  censorship: true       # Фильтр плохих слов и наказания
  commands-control: true # Ограничение доступа к командам
  anti-caps: true        # Автоматическое исправление регистра (КАПСА)

# -------------------------------------------------------------------------
# ФОРМАТ ЧАТА
# Поддерживает плейсхолдеры LuckPerms, Vault и другие через PAPI.
# Пример HEX: &#FFFFFF (Белый)
# -------------------------------------------------------------------------
chat-format:
  format: "&#55FF55%luckperms_prefix% &7%player_name% &8» &f%message%"

# -------------------------------------------------------------------------
# УПОМИНАНИЯ (MENTIONS)
# Когда игрока зовут по нику, он услышит звук и увидит подсветку.
# -------------------------------------------------------------------------
mentions:
  enabled: true
  color: "&#FFFF55&l" # Цвет подсветки ника в сообщении

# -------------------------------------------------------------------------
# АВТО-СООБЩЕНИЯ
# Интервал указывается в СЕКУНДАХ.
# -------------------------------------------------------------------------
auto-messages:
  interval: 300
  messages:
    - "&#00FBFF[Инфо] &fПрисоединяйтесь к нашему Discord! &7(см. contacts.md)"
    - "&#FFCC00[Помощь] &fНашли баг? Сообщите администрации через /helpop"
    - "&#AAFF00[ChatMT] &fИспользуйте &#FFFF55/chatmt reload &fдля обновления настроек."

# -------------------------------------------------------------------------
# ЦЕНЗУРА (АНТИ-МАТ)
# Punishment-command: команда от консоли. %player% - ник нарушителя.
# -------------------------------------------------------------------------
censorship:
  blocked-words:
    - "badword1"
    - "badword2"
  punishment-command: "mtkick %player% &#FF5555Мат в чате запрещен!"

# -------------------------------------------------------------------------
# КОНТРОЛЬ КОМАНД
# List-type: 
#   BLACK_LIST - блокировать команды из списка.
#   WHITE_LIST - разрешить ТОЛЬКО команды из списка.
# -------------------------------------------------------------------------
commands-control:
  list-type: BLACK_LIST
  list:
    - "plugins"
    - "pl"
    - "ver"
    - "version"
    - "help"
    - "?"
  # Ключ сообщения из файла lang/
  blocked-message-key: "command-blocked"

# +-----------------------------------------------------------------------+
# | End of Configuration. Don't forget to reload: /chatmt reload          |
# +-----------------------------------------------------------------------+