# +-----------------------------------------------------------------------+
# |                       ChatMT - Ultimate Solution                      |
# |        Поддержка HEX, Мульти-чатов, Цензуры и Анти-спама              |
# +-----------------------------------------------------------------------+

# Основной язык плагина (файлы в папке lang/)
language: ru

# Глобальное управление модулями
modules:
  chat-format: true      # Форматирование чата (PAPI + HEX)
  multi-chat: true       # Разделение на Локальный/Глобальный чаты
  auto-messages: true    # Автоматические объявления в чат
  censorship: true       # Фильтр плохих слов и наказания
  commands-control: true # Ограничение доступа к командам (кэ)
  anti-caps: true        # Автоматическое исправление КАПСА
  join-quit: true        # Кастомные сообщения входа/выхода
  replacer: true         # Авто-замена символов (смайлики)
  anti-spam: true        # Защита от частого написания сообщений

# 1. СООБЩЕНИЯ ВХОДА И ВЫХОДА
join-quit:
  join: "&#55FF55[+] &7%player% зашел на сервер"
  quit: "&#FF5555[-] &7%player% покинул сервер"

# 2. НАСТРОЙКА МУЛЬТИ-ЧАТОВ
# radius: -1 (весь сервер), 0 (текущий мир), >0 (расстояние в блоках)
chats:
  local:
    symbol: ""          # Без символа - сообщение попадет в локальный чат
    radius: 100
    format: "&7[L] %luckperms_prefix% &f%player% &8» &7%message%"
  global:
    symbol: "!"         # Сообщения начинающиеся с ! (например: !Всем привет)
    radius: -1
    format: "&e[G] %luckperms_prefix% &f%player% &8» &f%message%"
  world:
    symbol: "?"         # Сообщения начинающиеся с ?
    radius: 0
    format: "&b[W] %luckperms_prefix% &f%player% &8» &f%message%"

# 3. УПОМИНАНИЯ (MENTIONS)
mentions:
  enabled: true
  color: "&#FFFF55&l" # Цвет подсветки ника игрока, когда его позвали

# 4. АВТО-СООБЩЕНИЯ (INTERVAL В СЕКУНДАХ)
auto-messages:
  interval: 300
  messages:
    - "&#00FBFF[Инфо] &fПрисоединяйтесь к нашему Discord!"
    - "&#FFCC00[Помощь] &fНашли баг? Пишите в /helpop"
    - "&#AAFF00[ChatMT] &fИспользуйте &#FFFF55/chatmt reload &fдля настроек."

# 5. ЦЕНЗУРА (АНТИ-МАТ)
censorship:
  blocked-words:
    - "badword1"
    - "badword2"
  punishment-command: "mtkick %player% &#FF5555Мат в чате запрещен!"

# 6. КОНТРОЛЬ КОМАНД (кэ)
commands-control:
  list-type: BLACK_LIST # BLACK_LIST или WHITE_LIST
  list:
    - "plugins"
    - "pl"
    - "ver"
    - "version"
    - "help"
    - "?"
  blocked-message-key: "command-blocked"

# 7. АВТО-ЗАМЕНА (REPLACER)
replacer:
  "<3": "❤️"
  ":star:": "⭐️"
  "(!)": "⚠️"
  "-->": "→"

# 8. АНТИ-СПАМ
anti-spam:
  cooldown: 3 # Задержка в секундах между сообщениями

# +-----------------------------------------------------------------------+
# | Не забудьте обновить сообщения в папке lang/ru.yml                    |
# +-----------------------------------------------------------------------+