# ========================================================== #
#                                                            #
#                 ChatMT V2 - Configuration                  #
#                   Author: MT Studio                        #
#                                                            #
# ========================================================== #
# [RU] Поддерживается форматирование MiniMessage (градиенты, ховеры, клики)
# [EN] MiniMessage formatting is supported (gradients, hovers, clicks)

system:
  # [RU] Выберите язык плагина (файлы из папки plugins/ChatMT/language/)
  # [EN] Select plugin language (files from plugins/ChatMT/language/)
  # Доступно / Available: ru, en
  language: "ru"

ai:
  # [RU] Настройки интеграции с нейросетью Gemini
  # [EN] Gemini AI integration settings
  gemini:
    enabled: true
    api-key: "ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ / INSERT_YOUR_KEY_HERE"
    model: "gemini-3.5-flash-lite"
    # [RU] Триггер, на который будет реагировать бот
    # [EN] Trigger word for the bot
    trigger: "Бот,"

chat:
  # [RU] Радиус локального чата (в блоках). Если -1, то радиус отключен
  # [EN] Local chat radius (in blocks). Set to -1 to disable
  local-radius: 100
  # [RU] Символ для отправки сообщения в глобальный чат
  # [EN] Prefix used to send messages to global chat
  global-prefix: "!"

  # [RU] Формат чата (Оставь пустым "", если используешь другой плагин на чат, например LuckPerms+ChatEx)
  # [EN] Chat format (Leave blank "" if using another chat plugin)
  format:
    global: "<dark_gray>[<gold>G<dark_gray>] <gray>%player% <dark_gray>» <white>%message%"
    local: "<dark_gray>[<yellow>L<dark_gray>] <gray>%player% <dark_gray>» <white>%message%"

  mentions:
    # [RU] Настройки упоминаний (@Ник)
    # [EN] Player mentions settings (@PlayerName)
    enabled: true
    color: "<yellow><bold>"
    # [RU] Настройка звука при упоминании (Оставьте пусто "", чтобы отключить)
    # [EN] Mention sound settings (Leave blank "" to disable)
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2

filters:
  caps:
    enabled: true
    # [RU] Минимальная длина сообщения для проверки
    # [EN] Minimum message length to check
    min-length: 5
    # [RU] Максимально допустимый процент заглавных букв
    # [EN] Maximum allowed percentage of uppercase letters
    max-percent: 70
    # [RU] Действие: 'block' (запретить отправку), 'lower' (перевести в нижний регистр)
    # [EN] Action: 'block' (prevent sending), 'lower' (convert to lowercase)
    action: "lower"

  spam:
    enabled: true
    # [RU] Задержка между сообщениями (в секундах)
    # [EN] Delay between messages (in seconds)
    delay-seconds: 1.5

  advertising:
    enabled: true
    # [RU] Разрешенные ссылки
    # [EN] Allowed domains
    whitelist:
      - "vk.com"
      - "discord.gg"
      - "youtube.com"
      - "t.me"

  swear:
    enabled: true
    # [RU] Действие: 'block' (запретить), 'replace' (заменить на звездочки)
    # [EN] Action: 'block' (prevent sending), 'replace' (replace with stars)
    action: "replace"
    replace-char: "*"
    # [RU] Список запрещенных слов
    # [EN] List of blocked words
    words:
      - "дурак"
      - "idiot"

broadcast:
  enabled: true
  # [RU] Интервал между авто-сообщениями в секундах (300 = 5 минут)
  # [EN] Interval between auto-messages in seconds (300 = 5 minutes)
  interval: 300
  prefix: "<dark_gray>[<gradient:#00c6ff:#0072ff>Info</gradient><dark_gray>] <white>"
  messages:
    - "Не забывайте голосовать за наш сервер! / Don't forget to vote for our server!"
    # Пример использования MiniMessage для кликабельной ссылки
    - "Нашли баг? Пишите в Discord: <click:open_url:'https://discord.gg/your_guild'><aqua><underlined>discord.gg/your_guild</underlined></aqua></click>"
    - "В магазине скидки! Пиши <click:run_command:'/donate'><hover:show_text:'<green>Нажми, чтобы открыть донат-меню!'><green>/donate</green></hover></click>"

punishments:
  # [RU] Лимит предупреждений до автоматического наказания
  # [EN] Warning limit before automatic punishment
  warn-limit: 3
  # [RU] Время системного мута при достижении лимита варнов (в секундах, 7200 = 2 часа)
  # [EN] System mute duration when warn limit is reached (in seconds)
  warn-mute-duration: 7200

database:
  # [RU] Тип базы данных: sqlite или mysql
  # [EN] Database type: sqlite or mysql
  type: "sqlite"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "chatmt"
    username: "root"
    password: "password"